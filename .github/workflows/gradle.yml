name: Java CI

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Set up repository
        uses: actions/checkout@v7

      - name: Run repository-wide tests
        if: runner.os == 'Linux'
        working-directory:  ${{ github.workspace }}/.github
        run: ./run-checks.sh

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          java-package: jdk

      - name: Build and check with Gradle
        shell: bash
        run: |
          if [ "$RUNNER_OS" = 'Linux' ]; then
            xvfb-run -a ./gradlew check coverage
          else
            ./gradlew check coverage
          fi

      - name: Upload coverage reports to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  packaging:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mac-platform: [mac, mac-aarch64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          java-package: jdk
      - name: Verify packaged native payloads and rejection cases
        run: ./gradlew clean shadowJar verifyMacNatives testNativeVerifier -PjavafxMacPlatform=${{ matrix.mac-platform }}
      - name: Check external inspection cannot override build verification
        shell: bash
        run: |
          artifact=build/libs/addressbook.jar
          if [ '${{ matrix.mac-platform }}' = mac-aarch64 ]; then
            artifact=build/libs/addressbook-mac-aarch64.jar
          fi
          ./gradlew verifyExternalMacNatives -PjavafxMacPlatform=${{ matrix.mac-platform }} -PjavafxVerificationJar="$artifact"
          if ./gradlew verifyMacNatives -PjavafxMacPlatform=${{ matrix.mac-platform }} -PjavafxVerificationJar="$artifact" > override.log 2>&1; then
            echo 'ERROR: Build verification accepted an external artifact override'
            exit 1
          fi
          cat override.log
          grep -F 'verifyMacNatives always checks shadowJar' override.log
