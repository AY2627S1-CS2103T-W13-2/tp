name: Java CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  packaging:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
          java-package: jdk
      - uses: gradle/actions/wrapper-validation@v6
      - name: Build universal candidate and exercise verifier
        run: ./gradlew clean shadowJar verifyMacNatives testNativeVerifier
      - name: Record candidate identity
        run: |
          git rev-parse HEAD > build/libs/COMMIT.txt
          cd build/libs
          shasum -a 256 addressbook.jar > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: universal-natives
          path: build/universal-natives/*.dylib
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: universal-candidate
          path: build/libs/
          if-no-files-found: error

  build:
    needs: packaging
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-15-intel, macos-15]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
          java-package: jdk
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/download-artifact@v4
        with:
          name: universal-natives
          path: prepared-natives
      - uses: actions/download-artifact@v4
        with:
          name: universal-candidate
          path: candidate
      - name: Run repository-wide checks
        if: runner.os == 'Linux'
        run: .github/run-checks.sh
      - name: Run tests and verify packaged natives
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a ./gradlew check coverage -PuniversalNativesDir=prepared-natives
          else
            ./gradlew check coverage -PuniversalNativesDir=prepared-natives
          fi
      - name: Verify the shared candidate and prevent verifier override
        shell: bash
        run: |
          cd candidate
          shasum -a 256 -c SHA256SUMS.txt
          cd ..
          ./gradlew verifyExternalMacNatives -PjavafxVerificationJar=candidate/addressbook.jar
          if ./gradlew verifyMacNatives -PuniversalNativesDir=prepared-natives -PjavafxVerificationJar=candidate/addressbook.jar > override.log 2>&1; then
            echo 'ERROR: Build verification accepted an external artifact override'
            exit 1
          fi
          grep -F 'verifyMacNatives always checks shadowJar' override.log
      - name: Upload coverage reports to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
